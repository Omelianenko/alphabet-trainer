<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Алфавіт — Тренажер</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Алфавіт</h1>
      <p class="subtitle">Яка літера йде наступною?</p>
      <nav>
        <button id="btn-quiz" class="nav-btn active">Гра</button>
        <button id="btn-stats" class="nav-btn">Статистика</button>
      </nav>
    </header>

    <main id="quiz-view">
      <div id="question-area">
        <div class="prompt">Яка літера йде після</div>
        <div id="current-letter" class="big-letter">?</div>
      </div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="input-area">
        <input type="text" id="custom-input" maxlength="2" autocomplete="off" autocapitalize="characters" placeholder="Введіть літеру..." />
        <button id="custom-submit">→</button>
      </div>

      <div id="options" class="options-grid hidden"></div>

      <button id="toggle-mode" class="toggle-mode-btn">Показати варіанти</button>

      <button id="next-btn" class="next-btn hidden">Далі →</button>

      <div id="timer-bar-container" class="timer-bar-container hidden">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div id="timer-settings" class="timer-settings">
        <span class="timer-settings-label">Таймер:</span>
        <button class="timer-opt" data-time="2000">2с</button>
        <button class="timer-opt active" data-time="3000">3с</button>
        <button class="timer-opt" data-time="5000">5с</button>
        <button class="timer-opt" data-time="0">Вимк</button>
      </div>

      <div id="streak-display" class="streak-display">
        <div class="streak-current">
          <span id="streak-count">0</span>
          <span class="streak-label">серія</span>
        </div>
        <div class="streak-record">
          <span class="streak-record-label">рекорд:</span>
          <span id="streak-record">0</span>
        </div>
      </div>

      <div id="session-stats" class="session-stats">
        <span id="session-correct">0</span> ✓ &nbsp;/&nbsp; <span id="session-wrong">0</span> ✗
      </div>
    </main>

    <main id="stats-view" class="hidden">
      <div class="stats-header">
        <h2>Ваша статистика</h2>
        <button id="reset-stats" class="reset-btn">Скинути</button>
      </div>
      <div class="stats-summary">
        <div class="stat-card">
          <div class="stat-value" id="total-answered">0</div>
          <div class="stat-label">Відповідей</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-accuracy">0%</div>
          <div class="stat-label">Точність</div>
        </div>
      </div>
      <table id="stats-table">
        <thead>
          <tr>
            <th>Після</th>
            <th>Відповідь</th>
            <th>Показано</th>
            <th>Вірно</th>
            <th>Точність</th>
            <th>Час</th>
          </tr>
        </thead>
        <tbody id="stats-body"></tbody>
      </table>
    </main>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
